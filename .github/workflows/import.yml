name: Import complete hardware project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and restore all project files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --branch import/full-project "https://github.com/$GITHUB_REPOSITORY.git" work
          cd work
          cat project-upload.chunk-* > "$RUNNER_TEMP/project.bundle"
          echo "97731e71a8406e8bf96dc45c4c95fe96930dc9acbaf15f72912212aa0aee41c5  $RUNNER_TEMP/project.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/project.bundle"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout main
          git fetch "$RUNNER_TEMP/project.bundle" main
          git merge --allow-unrelated-histories --no-commit FETCH_HEAD
          test "$(git ls-files | wc -l)" -eq 5471
          git commit -m "Import all 5470 project files, wiring, component selection and historical firmware"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin main
