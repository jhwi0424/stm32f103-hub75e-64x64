name: Import complete hardware project
on:
  push:
    paths:
      - 'project.bundle.part-*'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and import all tracked files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone "https://github.com/$GITHUB_REPOSITORY.git" work
          cd work
          cat project.bundle.part-000 project.bundle.part-001 project.bundle.part-002 project.bundle.part-003 > "$RUNNER_TEMP/project.bundle"
          echo "97731e71a8406e8bf96dc45c4c95fe96930dc9acbaf15f72912212aa0aee41c5  $RUNNER_TEMP/project.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/project.bundle"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch "$RUNNER_TEMP/project.bundle" main
          git merge --allow-unrelated-histories --no-commit FETCH_HEAD
          git rm -- project.bundle.part-000 project.bundle.part-001 project.bundle.part-002 project.bundle.part-003
          test "$(git ls-files | wc -l)" -eq 5471
          git commit -m "Import all 5470 project files, wiring, component selection and historical firmware"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin main
